<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #1b2430;
    --navy-deep: #141b24;
    --paper: #f6f4ee;
    --ink: #21252b;
    --gold: #c9a24b;
    --gold-deep: #a97e2b;
    --muted: #7c7f86;
    --green: #3f6b4f;
    --danger: #a33f3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 30% 0%, var(--navy) 0%, var(--navy-deep) 65%);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 460px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 40px;
    line-height: 1.1;
    margin: 4px 0 18px;
    color: var(--paper);
  }
  .eventline { font-size: 15px; color: var(--gold); margin: 0; }
  .greeting { font-size: 16px; line-height: 1.5; color: #d6d9e0; margin: 0 0 28px; }

  .card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    padding: 34px 32px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  .card h1 { color: var(--ink); font-size: 32px; }
  .card .greeting { color: #4b4e54; }
  .card .eventline { color: var(--gold-deep); }

  label { display: block; font-size: 13.5px; font-weight: 600; color: #55585e; margin: 0 0 6px; }
  input[type="text"], input[type="tel"], input[type="email"], input[type="password"] {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 11px 13px;
    border: 1px solid #d7d3c6;
    border-radius: 7px;
    background: #fff;
    color: var(--ink);
    margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--gold-deep); outline-offset: 1px; }

  .radio-group { display: flex; gap: 22px; margin-bottom: 20px; }
  .radio-option {
    display: flex; align-items: center; gap: 7px;
    font-size: 15px; font-weight: 500; color: var(--ink);
    margin: 0; cursor: pointer;
  }
  .radio-option input[type="radio"] { width: 16px; height: 16px; margin: 0; cursor: pointer; }

  button[type="submit"], .primary-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: var(--gold-deep);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button[type="submit"]:hover, .primary-btn:hover { background: #8f6a24; }
  button:disabled { opacity: 0.6; cursor: default; }

  .error { color: var(--danger); font-size: 13.5px; margin: -8px 0 14px; }
  .success { color: var(--green); font-size: 13.5px; margin: -8px 0 14px; }

  footer {
    width: 100%;
    max-width: 460px;
    text-align: center;
    padding-top: 32px;
  }
  #admin-toggle {
    background: none;
    border: none;
    color: #5b626f;
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
    padding: 6px 10px;
  }
  #admin-toggle:hover { color: #9aa0ad; }

  #admin-panel {
    margin-top: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 20px;
    text-align: left;
  }
  #admin-panel h2 {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #c7ccd6;
    margin: 0 0 14px;
    text-transform: none;
  }
  #admin-panel input { margin-bottom: 10px; }
  #admin-panel .error, #admin-panel .success { margin: -4px 0 10px; }
  #admin-summary { color: #d6d9e0; font-size: 14px; margin: 0 0 14px; }
  #admin-signout {
    background: none; border: none; color: #8890a0; font-size: 12.5px;
    cursor: pointer; font-family: inherit; margin-top: 10px; padding: 0;
  }
  #admin-signout:hover { color: #c7ccd6; }
</style>
</head>
<body>

<main class="wrap">
  <div class="card" id="register-card">
    <p class="eventline">You're invited to</p>
    <h1>Our Gathering</h1>
    <p class="greeting">Fill in your details below and we'll save your spot.</p>

    <form id="register-form">
      <label for="name-input">Full name</label>
      <input type="text" id="name-input" required />

      <label for="phone-input">Active phone / WhatsApp number</label>
      <input type="tel" id="phone-input" placeholder="e.g. 0241234567" required />

      <label for="email-input">Email</label>
      <input type="email" id="email-input" placeholder="e.g. you@example.com" required />

      <label for="occupation-input">Occupation/School</label>
      <input type="text" id="occupation-input" required />

      <label>Will you be attending?</label>
      <div class="radio-group">
        <label class="radio-option"><input type="radio" name="attending" value="yes" required /> Yes</label>
        <label class="radio-option"><input type="radio" name="attending" value="no" /> No</label>
      </div>

      <p id="register-error" class="error" hidden></p>
      <button type="submit" id="register-btn">Confirm RSVP</button>
    </form>
  </div>

  <div class="card" id="thankyou-card" hidden>
    <h1>You're all set</h1>
    <p class="greeting" id="thankyou-message"></p>
  </div>
</main>

<footer>
  <button id="admin-toggle">Admin</button>
  <div id="admin-panel" hidden>

    <div id="admin-login-view">
      <h2>Admin sign in</h2>
      <form id="admin-login-form">
        <label for="admin-username">Admin email</label>
        <input type="text" id="admin-username" autocomplete="username" required />
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" autocomplete="current-password" required />
        <p id="admin-login-error" class="error" hidden></p>
        <button type="submit" class="primary-btn">Sign in</button>
      </form>
    </div>

    <div id="admin-dashboard-view" hidden>
      <h2>Registrations</h2>
      <p id="admin-summary">Loading…</p>
      <button id="download-csv" class="primary-btn" type="button">Download CSV</button>
      <button id="admin-signout">Sign out</button>
    </div>

  </div>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, serverTimestamp,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // =========================================================================
  // Paste your Firebase project config here.
  // Firebase console > Project settings > General > Your apps > SDK setup.
  // This object is meant to be public — it just identifies the project.
  // Access is actually controlled by Firestore security rules and Auth.
  // =========================================================================
  const firebaseConfig = {
    apiKey: "PASTE_ME",
    authDomain: "PASTE_ME",
    projectId: "PASTE_ME",
    storageBucket: "PASTE_ME",
    messagingSenderId: "PASTE_ME",
    appId: "PASTE_ME",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // ---- Registration form ----
  const registerForm = document.getElementById('register-form');
  const registerError = document.getElementById('register-error');
  const registerBtn = document.getElementById('register-btn');
  const registerCard = document.getElementById('register-card');
  const thankyouCard = document.getElementById('thankyou-card');
  const thankyouMessage = document.getElementById('thankyou-message');

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    registerError.hidden = true;
    const name = document.getElementById('name-input').value.trim();
    const phone = document.getElementById('phone-input').value.trim();
    const email = document.getElementById('email-input').value.trim();
    const occupation = document.getElementById('occupation-input').value.trim();
    const attendingInput = registerForm.querySelector('input[name="attending"]:checked');
    const attending = attendingInput ? attendingInput.value : null;

    if (!attending) {
      registerError.textContent = 'Please let us know if you will be attending.';
      registerError.hidden = false;
      return;
    }

    registerBtn.disabled = true;
    registerBtn.textContent = 'Confirming…';
    try {
      await addDoc(collection(db, 'registrations'), {
        name, phone, email, occupation, attending,
        createdAt: serverTimestamp(),
      });
      thankyouMessage.textContent = attending === 'yes'
        ? `Thanks for registering, ${name}. See you there!`
        : `Thanks for letting us know, ${name}. Sorry you can't make it!`;
      registerCard.hidden = true;
      thankyouCard.hidden = false;
    } catch (err) {
      registerError.textContent = 'Something went wrong. Please try again.';
      registerError.hidden = false;
    } finally {
      registerBtn.disabled = false;
      registerBtn.textContent = 'Confirm RSVP';
    }
  });

  // ---- Admin panel ----
  const adminToggle = document.getElementById('admin-toggle');
  const adminPanel = document.getElementById('admin-panel');
  const adminLoginView = document.getElementById('admin-login-view');
  const adminDashboardView = document.getElementById('admin-dashboard-view');
  const adminLoginForm = document.getElementById('admin-login-form');
  const adminLoginError = document.getElementById('admin-login-error');
  const adminSummary = document.getElementById('admin-summary');
  const adminSignout = document.getElementById('admin-signout');
  const downloadCsvBtn = document.getElementById('download-csv');

  adminToggle.addEventListener('click', () => {
    adminPanel.hidden = !adminPanel.hidden;
  });

  // Auth state (and therefore which admin view shows) is tracked continuously,
  // so a signed-in admin stays signed in across page reloads too.
  onAuthStateChanged(auth, (user) => {
    if (user) {
      adminLoginView.hidden = true;
      adminDashboardView.hidden = false;
      loadSummary();
    } else {
      adminLoginView.hidden = false;
      adminDashboardView.hidden = true;
    }
  });

  adminLoginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    adminLoginError.hidden = true;
    const email = document.getElementById('admin-username').value.trim();
    const password = document.getElementById('admin-password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      adminLoginError.textContent = 'Could not sign in.';
      adminLoginError.hidden = false;
    }
  });

  adminSignout.addEventListener('click', () => signOut(auth));

  async function loadSummary() {
    adminSummary.textContent = 'Loading…';
    const snap = await getDocs(collection(db, 'registrations'));
    let count = 0, yes = 0;
    snap.forEach((doc) => {
      count += 1;
      if (doc.data().attending === 'yes') yes += 1;
    });
    adminSummary.textContent = `${count} registered — ${yes} attending, ${count - yes} not attending.`;
  }

  downloadCsvBtn.addEventListener('click', async () => {
    const snap = await getDocs(collection(db, 'registrations'));
    const rows = [['Timestamp', 'Name', 'Phone', 'Email', 'Occupation', 'Attending']];
    snap.forEach((doc) => {
      const d = doc.data();
      const ts = d.createdAt && d.createdAt.toDate ? d.createdAt.toDate().toISOString() : '';
      rows.push([ts, d.name, d.phone, d.email, d.occupation, d.attending]);
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'registrations.csv';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
